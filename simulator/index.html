<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tonybot 动作模拟器</title>
  <style>
    :root {
      --bg: #0c1014;
      --bg-2: #121922;
      --panel: rgba(14, 20, 28, 0.92);
      --panel-2: rgba(19, 27, 37, 0.94);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #edf2f7;
      --text-soft: #b4c0ce;
      --text-dim: #7f8a98;
      --red: #ff8a7a;
      --blue: #7fc8ff;
      --green: #73e0b5;
      --gold: #f1c56d;
      --shadow-lg: 0 18px 50px rgba(0, 0, 0, 0.36);
      --shadow-sm: 0 4px 18px rgba(0, 0, 0, 0.2);
      --radius: 18px;
      --radius-sm: 10px;
      --font-display: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: var(--font-display);
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(255, 138, 122, 0.14), transparent 28%),
        radial-gradient(circle at top right, rgba(127, 200, 255, 0.14), transparent 30%),
        linear-gradient(145deg, var(--bg), var(--bg-2));
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button,
    select {
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    button:hover,
    select:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.16);
    }

    button:active {
      transform: scale(0.97);
    }

    button.active {
      background: rgba(127, 200, 255, 0.18);
      border-color: rgba(127, 200, 255, 0.32);
      color: #fff;
    }

    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 30px;
    }

    #topbar {
      height: 68px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(8, 12, 16, 0.72);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    #topbar h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    #topbar .sub {
      color: var(--gold);
      font-size: 12px;
      white-space: nowrap;
      opacity: 0.88;
    }

    .spacer {
      flex: 1;
    }

    #frame-summary {
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    #main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px minmax(360px, 1fr) 380px;
      gap: 14px;
      padding: 14px;
      min-height: 0;
    }

    .panel-shell {
      min-height: 0;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0));
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.05em;
    }

    .panel-head p {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    #inspector {
      gap: 0;
    }

    #inspector-scroll,
    #sliders-scroll {
      overflow: auto;
      min-height: 0;
    }

    #inspector-scroll {
      padding: 16px 18px 18px;
    }

    .info-block {
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-block h3 {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #pose-array {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: 12px/1.6 var(--font-mono);
      color: var(--green);
    }

    #pose-stats {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .focus-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 62px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(127, 200, 255, 0.14);
      color: var(--blue);
      font: 700 12px var(--font-mono);
    }

    #focus-name {
      margin: 10px 0 4px;
      font-size: 20px;
    }

    .focus-joint {
      font: 12px var(--font-mono);
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .focus-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .focus-cell {
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .focus-cell span {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .focus-cell strong {
      display: block;
      font-size: 13px;
      line-height: 1.45;
    }

    .focus-long {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-soft);
    }

    #mirror-list {
      margin: 0;
      padding-left: 18px;
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.8;
    }

    #mapping-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .map-card {
      border-radius: 14px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.025);
      text-align: left;
      box-shadow: none;
    }

    .map-card.r_arm,
    .map-card.r_leg {
      border-color: rgba(255, 138, 122, 0.14);
    }

    .map-card.l_arm,
    .map-card.l_leg {
      border-color: rgba(127, 200, 255, 0.14);
    }

    .map-card.active {
      background: rgba(127, 200, 255, 0.12);
      border-color: rgba(127, 200, 255, 0.34);
      transform: translateY(-1px);
    }

    .map-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font: 700 12px var(--font-mono);
      margin-bottom: 8px;
    }

    .map-neutral {
      color: var(--text-dim);
    }

    .map-name {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .map-joint,
    .map-axis {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      line-height: 1.5;
    }

    #viewer {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%, rgba(127, 200, 255, 0.12), transparent 25%),
        radial-gradient(circle at 70% 18%, rgba(255, 138, 122, 0.14), transparent 28%),
        linear-gradient(160deg, rgba(7, 13, 20, 0.82), rgba(17, 25, 34, 0.96));
    }

    #viewport {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #viewer-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    .viewer-badge {
      align-self: flex-start;
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(7, 11, 16, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
    }

    .viewer-badge strong {
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .viewer-badge span {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .viewer-note {
      align-self: flex-end;
      max-width: 420px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(7, 11, 16, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12px;
      color: var(--text-soft);
      line-height: 1.6;
      backdrop-filter: blur(10px);
    }

    #controls {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #panel-header {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      color: var(--text-soft);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0));
    }

    #sliders-scroll {
      padding: 14px 16px 18px;
    }

    .slider-group {
      margin-bottom: 20px;
    }

    .slider-group-title {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .slider-group-title.group-r {
      color: var(--red);
      background: rgba(255, 138, 122, 0.1);
    }

    .slider-group-title.group-l {
      color: var(--blue);
      background: rgba(127, 200, 255, 0.1);
    }

    .slider-row {
      display: grid;
      grid-template-columns: auto minmax(84px, 112px) minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .slider-row:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .slider-row.active {
      background: rgba(127, 200, 255, 0.11);
      border-color: rgba(127, 200, 255, 0.26);
      transform: translateY(-1px);
    }

    .slider-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 46px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      font: 700 11px var(--font-mono);
      color: var(--text-soft);
    }

    .slider-label-wrap label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slider-joint {
      margin-top: 2px;
      color: var(--text-dim);
      font: 11px var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slider-row input[type=range] {
      width: 100%;
      min-width: 0;
      appearance: none;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
    }

    .slider-row input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
    }

    .slider-meta {
      min-width: 72px;
      text-align: right;
    }

    .slider-meta .val {
      display: block;
      color: var(--green);
      font: 700 12px var(--font-mono);
    }

    .slider-meta .deg {
      display: block;
      margin-top: 2px;
      color: var(--text-dim);
      font: 11px var(--font-mono);
    }

    #panel-presets {
      padding: 14px 16px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.02);
    }

    #panel-presets button {
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 12px;
    }

    #timeline {
      display: none;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.16);
    }

    #timeline.visible {
      display: flex;
    }

    #timeline .playback-controls {
      display: flex;
      gap: 6px;
    }

    #timeline .playback-controls button {
      border-radius: 12px;
      min-width: 42px;
      padding: 8px 10px;
    }

    .frame-info {
      min-width: 122px;
      color: var(--text-dim);
      font: 12px var(--font-mono);
    }

    .timeline-slider-wrapper {
      flex: 1;
      min-width: 0;
    }

    #timeline input[type=range] {
      width: 100%;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
    }

    #timeline input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--green);
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #jump-warning {
      display: none;
      margin: 0 14px 14px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(241, 197, 109, 0.18);
      background: rgba(241, 197, 109, 0.08);
      color: var(--gold);
      font: 12px/1.6 var(--font-mono);
    }

    #overlay-msg {
      position: fixed;
      top: 88px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(10, 16, 22, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    #overlay-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1400px) {
      #main {
        grid-template-columns: 280px minmax(300px, 1fr) 340px;
      }
    }

    @media (max-width: 1120px) {
      body {
        overflow: auto;
      }

      #main {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(420px, 50vh) auto;
      }

      #inspector,
      #controls {
        min-height: 0;
      }

      #viewer {
        min-height: 520px;
      }
    }
  </style>
</head>

<body>
  <div id="topbar">
    <h1 data-i18n="title">🤖 Tonybot 动作模拟器</h1>
    <span class="sub" data-i18n="subtitle"></span>
    <span class="spacer"></span>
    <span id="frame-summary" style="display:none;"></span>
    <select id="action-select" style="display:none;">
      <option value="" data-i18n="action_library">📋 动作库...</option>
    </select>
    <button id="btn-copy-pose" data-i18n-title="btn_copy_pose"><span data-i18n="btn_copy_pose"></span></button>
    <button id="btn-load-rob"><span data-i18n="btn_load_rob"></span></button>
    <button id="btn-reset-view" data-i18n-title="btn_reset_view">🔄</button>
    <button id="btn-toggle-grid" class="active" data-i18n-title="btn_toggle_grid">📐</button>
    <button id="btn-toggle-servo-labels" class="active" data-i18n-title="btn_toggle_labels">🏷️</button>
  </div>

  <div id="main">
    <aside id="inspector" class="panel-shell">
      <div class="panel-head">
        <h2>映射总览</h2>
        <p>以最新实测关节对应表为准。左侧用来交叉核对当前 Pose、镜像关系和单个舵机定义。</p>
      </div>
      <div id="inspector-scroll">
        <section class="info-block">
          <h3>实时 Pose</h3>
          <pre id="pose-array">[]</pre>
          <div id="pose-stats"></div>
        </section>

        <section class="info-block">
          <h3>当前舵机</h3>
          <div class="focus-id" id="focus-id">ID8</div>
          <div id="focus-name">右肩根部旋转轴</div>
          <div class="focus-joint" id="focus-joint">r_shoulder_pitch</div>
          <div class="focus-grid">
            <div class="focus-cell"><span>轴向</span><strong id="focus-axis"></strong></div>
            <div class="focus-cell"><span>镜像</span><strong id="focus-mirror"></strong></div>
            <div class="focus-cell"><span>站立值</span><strong id="focus-neutral"></strong></div>
            <div class="focus-cell"><span>当前值</span><strong id="focus-current"></strong></div>
            <div class="focus-cell"><span>偏移</span><strong id="focus-offset"></strong></div>
            <div class="focus-cell"><span>实测方向</span><strong id="focus-tested"></strong></div>
          </div>
          <div class="focus-long" id="focus-motion"></div>
        </section>

        <section class="info-block">
          <h3>镜像对照</h3>
          <ul id="mirror-list"></ul>
        </section>

        <section class="info-block">
          <h3>16 路速查</h3>
          <div id="mapping-grid"></div>
        </section>
      </div>
    </aside>

    <section id="viewer" class="panel-shell">
      <div id="viewport"></div>
      <div id="viewer-overlay">
        <div class="viewer-badge">
          <strong>Tonybot Action Simulator</strong>
          <span>3D FK 姿态预览 + 关节校对面板</span>
        </div>
        <div class="viewer-note">
          本页只负责姿态可视化和关节映射校对，不给出平衡、安全、支撑面或质心结论。安全审计仍由
          <code>tools/python/rob_safety.py</code> 负责。
        </div>
      </div>
    </section>

    <aside id="controls" class="panel-shell">
      <div id="panel-header" data-i18n="panel_header"></div>
      <div id="sliders-scroll"></div>
      <div id="panel-presets"></div>
      <div id="timeline">
        <div class="playback-controls">
          <button id="btn-prev" title="上一帧">⏮</button>
          <button id="btn-play" title="播放/暂停">▶</button>
          <button id="btn-next" title="下一帧">⏭</button>
        </div>
        <span class="frame-info" id="frame-info" data-i18n="timeline_no_data"></span>
        <div class="timeline-slider-wrapper">
          <input type="range" id="frame-slider" min="0" max="0" value="0" step="1">
        </div>
        <div class="speed-control">
          <span class="speed-label" data-i18n="timeline_speed"></span>
          <select id="speed-select">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1.0x</option>
            <option value="2">2.0x</option>
            <option value="4">4.0x</option>
          </select>
        </div>
      </div>
    </aside>
  </div>

  <div id="jump-warning"></div>
  <div id="overlay-msg"></div>
  <input type="file" id="file-input" accept=".rob" style="display:none">

  <script>
