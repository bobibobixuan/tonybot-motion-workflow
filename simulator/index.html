<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tonybot 3D 动作预览器</title>
  <style>
    :root {
      /* 基础调色板：更专业的暗夜工业风 */
      --bg: #13151a;
      --panel-bg: #1c1f26;
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #d1d5db;
      --text-muted: #8b949e;
      --accent: #e06c75;
      --accent2: #58a6ff;
      --accent3: #3fb950;
      --warn: #d29922;
      --danger: #f85149;
      --slider-track: rgba(255, 255, 255, 0.1);
      --group-r: #ff7b72;
      --group-l: #79c0ff;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* 顶部导航栏 */
    #topbar {
      height: 48px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    #topbar h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent2);
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    #topbar .spacer {
      flex: 1;
    }

    /* 通用按钮组件化 */
    button,
    select {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 6px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      white-space: nowrap;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      outline: none;
    }

    button:hover,
    select:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }

    button:active {
      transform: scale(0.96);
    }

    button.active {
      background: var(--accent2);
      color: #fff;
      border-color: var(--accent2);
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.3);
    }

    select {
      appearance: none;
      padding-right: 24px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b949e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 6px center;
      background-size: 14px;
    }

    select option {
      background: var(--panel-bg);
      color: var(--text-main);
    }

    /* 主视口布局 */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #viewport {
      flex: 1;
      position: relative;
      cursor: grab;
      background: radial-gradient(circle at center, #1f2229 0%, #13151a 100%);
    }

    #viewport:active {
      cursor: grabbing;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 右侧控制面板 */
    #panel {
      width: 340px;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.1);
      z-index: 5;
    }

    #panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.1);
    }

    #sliders-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .slider-group {
      margin-bottom: 20px;
    }

    .slider-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      display: inline-block;
    }

    .slider-group-title.group-r {
      background: rgba(255, 123, 114, 0.1);
      color: var(--group-r);
    }

    .slider-group-title.group-l {
      background: rgba(121, 192, 255, 0.1);
      color: var(--group-l);
    }

    .slider-group-title.group-u {
      background: rgba(139, 148, 158, 0.1);
      color: var(--text-muted);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 4px;
      margin-bottom: 2px;
      border-radius: var(--radius-sm);
      transition: background var(--transition);
    }

    .slider-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .slider-row label {
      width: 90px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
    }

    .slider-row input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: var(--slider-track);
      border-radius: 2px;
      outline: none;
      min-width: 0;
      transition: background var(--transition);
    }

    .slider-row input[type=range]:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .slider-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 2px var(--panel-bg), 0 2px 4px rgba(0, 0, 0, 0.5);
      transition: transform var(--transition);
    }

    .slider-row input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .slider-row .val {
      width: 36px;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 600;
      color: var(--accent2);
      font-size: 12px;
      flex-shrink: 0;
    }

    .slider-row .deg {
      width: 42px;
      text-align: right;
      color: var(--text-muted);
      font-size: 11px;
      flex-shrink: 0;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }

    /* 预设动作区 */
    #panel-presets {
      padding: 12px 16px;
      border-top: 1px solid var(--panel-border);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(0, 0, 0, 0.1);
    }

    #panel-presets button {
      padding: 4px 10px;
      font-size: 11px;
    }

    /* 底部时间轴 (Timeline) */
    #timeline {
      height: 56px;
      background: var(--panel-bg);
      border-top: 1px solid var(--panel-border);
      display: none;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      z-index: 10;
    }

    #timeline.visible {
      display: flex;
    }

    #timeline .playback-controls {
      display: flex;
      gap: 4px;
    }

    #timeline .playback-controls button {
      padding: 6px 12px;
      font-size: 14px;
      border-color: transparent;
    }

    #timeline .playback-controls button:hover {
      border-color: var(--panel-border);
    }

    #timeline .frame-info {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 110px;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .timeline-slider-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
    }

    #timeline input[type=range] {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      background: var(--slider-track);
      border-radius: 3px;
      outline: none;
    }

    #timeline input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent3);
      cursor: pointer;
      box-shadow: 0 0 0 2px var(--panel-bg), 0 2px 5px rgba(0, 0, 0, 0.4);
      transition: transform 0.1s;
    }

    #timeline input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #timeline .speed-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* 警告与通知浮层 */
    #jump-warning {
      display: none;
      background: rgba(210, 153, 34, 0.1);
      border-top: 1px solid rgba(210, 153, 34, 0.3);
      padding: 8px 20px;
      font-size: 11px;
      color: var(--warn);
      flex-shrink: 0;
      max-height: 60px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    #overlay-msg {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(28, 31, 38, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-main);
      padding: 8px 20px;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      box-shadow: var(--shadow-md);
    }

    #overlay-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

  <div id="topbar">
    <h1 data-i18n="title">🤖 Tonybot 动作模拟器</h1>
    <span style="font-size:11px;color:var(--warn); opacity: 0.8;" data-i18n="subtitle"></span>
    <span class="spacer"></span>
    <span id="frame-summary"
      style="font-size:12px;color:var(--text-muted);display:none; font-family: ui-monospace, monospace;"></span>
    <select id="action-select" style="display:none;">
      <option value="" data-i18n="action_library">📋 动作库...</option>
    </select>
    <button id="btn-copy-pose" data-i18n-title="btn_copy_pose"><span data-i18n="btn_copy_pose"></span></button>
    <button id="btn-load-rob"><span data-i18n="btn_load_rob"></span></button>
    <div style="width: 1px; height: 20px; background: var(--panel-border); margin: 0 4px;"></div>
    <button id="btn-reset-view" data-i18n-title="btn_reset_view">🔄</button>
    <button id="btn-toggle-grid" class="active" data-i18n-title="btn_toggle_grid">📐</button>
    <button id="btn-toggle-servo-labels" class="active" data-i18n-title="btn_toggle_labels">🏷️</button>
  </div>

  <div id="main">
    <div id="viewport"></div>
    <div id="panel">
      <div id="panel-header" data-i18n="panel_header"></div>
      <div id="sliders-scroll"></div>
      <div id="panel-presets"></div>
    </div>
  </div>

  <div id="timeline">
    <div class="playback-controls">
      <button id="btn-prev" title="上一帧">⏮</button>
      <button id="btn-play" title="播放/暂停">▶</button>
      <button id="btn-next" title="下一帧">⏭</button>
    </div>
    <span class="frame-info" id="frame-info" data-i18n="timeline_no_data"></span>
    <div class="timeline-slider-wrapper">
      <input type="range" id="frame-slider" min="0" max="0" value="0" step="1">
    </div>
    <div class="speed-control">
      <span class="speed-label" data-i18n="timeline_speed"></span>
      <select id="speed-select">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1.0x</option>
        <option value="2">2.0x</option>
        <option value="4">4.0x</option>
      </select>
    </div>
  </div>

  <div id="jump-warning"></div>
  <div id="overlay-msg"></div>
  <input type="file" id="file-input" accept=".rob" style="display:none">

  <script>
    window._i18nData = { "title": "Tonybot 动作模拟器", "subtitle": "仅做骨骼姿态预览，不输出平衡/安全结论", "btn_copy_pose": "📋 复制 Pose", "btn_load_rob": "📂 加载 .rob", "btn_reset_view": "🔄 重置视角", "btn_toggle_grid": "📐 切换网格", "btn_toggle_labels": "🏷️ 切换标签", "panel_header": "🦾 舵机通道 / 姿态预览 (0–1000)", "timeline_no_data": "未加载", "timeline_speed": "速度:", "overlay_loaded": "已加载", "overlay_load_fail": "加载失败", "overlay_pose_copied": "Pose 已复制", "overlay_frames": "帧", "action_library": "📋 动作库...", "jump_warning_prefix": "⚠ 帧跳变提示（仅展示舵机值突变，非安全结论）:", "jump_warning_more": "共 {count} 处跳变", "jump_entry": "帧{from}→{to}: {ids}", "frame_summary": "共 {total} 帧 · {elapsed} / {totalTime}", "frame_info": "帧 {current}/{total} · {duration}ms", "group_r_arm": "🟥 右臂", "group_l_arm": "🟦 左臂", "group_r_leg": "🟥 右腿", "group_l_leg": "🟦 左腿", "group_unused": "⬜ 未使用", "preset_lizheng": "立正", "preset_junli": "军礼", "preset_zhanbi": "展臂", "preset_chuixiong": "捶胸", "preset_zhengbu": "正步", "preset_shenshou": "伸手", "preset_dapeng": "大鹏展翅", "preset_back10": "后退10帧", "console_ready": "🤖 Tonybot 动作模拟器 已就绪", "console_drop_hint": "拖拽 .rob 文件到视口即可加载", "console_keyboard": "空格键 播放/暂停 | ← → 逐帧 | R 重置姿态", "console_copy_hint": "📋 复制 Pose 按钮可复制当前 16 舵机值", "console_mouse": "鼠标拖动旋转 | 滚轮缩放 | 右键平移", "channel_labels": { "0": "ID1 r_hip_yaw", "1": "ID2 r_ankle_axis", "2": "ID3 r_knee", "3": "ID4 r_hip_pitch", "4": "ID5 r_hip_roll", "5": "ID6 r_elbow", "6": "ID7 r_shoulder_axis_2", "7": "ID8 r_shoulder_pitch", "8": "ID9 l_hip_yaw", "9": "ID10 l_ankle_axis", "10": "ID11 l_knee", "11": "ID12 l_hip_pitch", "12": "ID13 l_hip_roll", "13": "ID14 l_elbow", "14": "ID15 l_shoulder_axis_2", "15": "ID16 l_shoulder_pitch" } };
    window._i18nLang = 'zh-CN';
  </script>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
